version: 1
frontend:
  phases:
    preBuild:
      commands:
        # Node 22+ is required; pnpm comes from package.json "packageManager" via corepack.
        - nvm use 22
        - corepack enable
        - pnpm install --frozen-lockfile
    build:
      commands:
        # The API address is public (it ends up in the browser bundle), so it lives here. An Amplify
        # environment variable with the same name overrides it, e.g. to point a test branch elsewhere.
        - echo "NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-https://aeoapi.4ouro.com}" > .env.production
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
