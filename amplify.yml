version: 1
# CI + CD in one place: every push to the connected branch runs these checks, and only a build
# that passes all of them is deployed. Any failing step stops the deploy (the live site stays as it was).
frontend:
  phases:
    preBuild:
      commands:
        # Node 22+ is required; pnpm comes from package.json "packageManager" via corepack.
        - nvm use 22
        - corepack enable
        # Exact versions from the lockfile (fails if package.json and the lockfile disagree).
        - pnpm install --frozen-lockfile
        # Dependency audit: block the deploy on known high or critical vulnerabilities in production packages.
        - pnpm audit --prod --audit-level=high
    build:
      commands:
        # The API address is public (it ends up in the browser bundle), so it lives here. An Amplify
        # environment variable with the same name overrides it, e.g. to point a test branch elsewhere.
        - export NEXT_PUBLIC_API_URL="${NEXT_PUBLIC_API_URL:-https://aeoapi.4ouro.com}"
        # Guard: a deployed site must never call a local or plain-http backend.
        - |
          case "$NEXT_PUBLIC_API_URL" in
            https://localhost*|https://127.*|https://0.0.0.0*) echo "Refusing to deploy: NEXT_PUBLIC_API_URL points to a local backend ($NEXT_PUBLIC_API_URL)"; exit 1 ;;
            https://*) echo "API: $NEXT_PUBLIC_API_URL" ;;
            *) echo "Refusing to deploy: NEXT_PUBLIC_API_URL must be an https:// address ($NEXT_PUBLIC_API_URL)"; exit 1 ;;
          esac
        - echo "NEXT_PUBLIC_API_URL=$NEXT_PUBLIC_API_URL" > .env.production
        # Code quality gates.
        - pnpm lint
        - pnpm typecheck
        # Production build (also fails on type or compile errors).
        - pnpm build
  artifacts:
    baseDirectory: .next
    files:
      - '**/*'
  cache:
    paths:
      - .next/cache/**/*
      - node_modules/**/*
